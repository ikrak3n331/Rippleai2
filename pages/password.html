<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password — Ripple 2.0 Extended</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/src/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles.css">
  <!-- No gate include here: this is the page the gate sends people to. -->
</head>
<body class="login-body">
<!--#include partials/sprite.html -->

<a class="skip-link" href="#main-content">Skip to main content</a>

<!-- Same single full-bleed panel as the Log in page — brand wedge, centred
     card — with one field instead of two. -->
<div class="login">
  <svg class="login__flourish" viewBox="0 0 207 887" preserveAspectRatio="none"
       aria-hidden="true" focusable="false">
    <polygon points="0,0 207,0 207,444.6" fill="var(--rpl-primary)"/>
  </svg>

  <span class="login__logo">
    <svg class="login__logo-mark" role="img" aria-label="Victoria State Government"><use href="#i-vic-logo"></use></svg>
  </span>

  <main id="main-content" class="login__container">
    <form class="login__content" method="post" data-password-form novalidate>
      <h1 class="login__system">Salesforce page examples</h1>
      <p class="login__heading">Enter password</p>

      <div class="field login__field">
        <label class="field__label" for="gate-pass">
          Password <span class="field__required" aria-hidden="true">*</span><span class="sr-only">(required)</span>
        </label>
        <span class="field__hint">These examples are password protected.</span>
        <span class="field__control">
          <input class="input" id="gate-pass" name="password" type="password"
                 autocomplete="current-password" placeholder="Password"
                 aria-describedby="gate-error" required>
        </span>
      </div>

      <p class="login__error" id="gate-error" role="alert" hidden>That password is not correct.</p>

      <button type="submit" class="btn btn--filled login__submit">Continue</button>
    </form>
  </main>
</div>

<script type="module" src="/src/password.js"></script>
</body>
</html>
